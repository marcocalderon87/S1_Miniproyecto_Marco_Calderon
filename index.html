<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mini Help Desk</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header>
        <h1>Mini Help Desk</h1>
        <p>Registro de incidencias informáticas</p>
    </header>

    <main>

        <section class="resumen">

            <div class="tarjeta">
                <h3>Total de tickets</h3>
                <p id="totalTickets">0</p>
            </div>
             <div class="tarjeta">
                <h3>Prioridad alta</h3>
                <p id="totalAlta">0</p>
            </div>

            <div class="tarjeta">
                <h3>Horas estimadas</h3>
                <p id="totalHoras">0</p>
            </div>

        </section>

        <section class="panel">

            <h2>Registrar incidencia</h2>

            <form id="formTicket" novalidate>

                <label for="descripcion">
                    Descripción del incidente
                </label>

                <input type="text"
                    id="descripcion"
                    maxlength="100"
                    placeholder="Ej. Error de impresora">

                <label for="prioridad">
                    Prioridad
                </label>

                <select id="prioridad">
                    <option value="">Seleccionar</option>
                    <option value="Alta">Alta</option>
                    <option value="Media">Media</option>
                    <option value="Baja">Baja</option>
                </select>

                <label for="horas">
                    Horas estimadas
                </label>

                <input type="number"
                    id="horas"
                    min="1"
                    max="24"
                    placeholder="Ej. 2">

                <label class="opcion">
                    <input type="checkbox" id="simularError">
                    Simular error del servicio
                </label>

                <button type="submit" id="btnRegistrar">
                    Registrar incidencia
                </button>

            </form>

            <p id="mensaje" role="status"
                aria-live="polite"></p>

        </section>

        <section class="panel">

            <h2>Incidencias registradas</h2>

            <label for="filtro">
                Filtrar por prioridad
            </label>

            <select id="filtro">
                <option value="Todas">Todas</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Incidencia</th>
                            <th>Prioridad</th>
                            <th>Horas</th>
                        </tr>
                    </thead>

                    <tbody id="listaTickets">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        Mini Help Desk | Universidad Fidélitas
    </footer>

    <script type="module" src="src/main.js"></script>

</body>

</html>
